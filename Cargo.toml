[package]
name = "routels"
version = "0.1.0"
edition = "2021"
description = "Fast offline linter + LSP server for network configs: Arista EOS, FRR, VyOS, MikroTik RouterOS, BIRD, nftables/iptables, HAproxy, WireGuard, sysctl, Debian /etc/network/interfaces"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rotkonetworks/routels"

[[bin]]
name = "routels"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
dashmap = "5"

[dev-dependencies]
serde_json = "1"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
