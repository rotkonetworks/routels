! good EOS-style config
hostname spine1
!
interface Ethernet1
   description to-leaf1
   no switchport
   ip address 10.0.0.1/31
   ipv6 address 2001:db8::1/127
!
interface Loopback0
   ip address 10.255.0.1/32
!
router bgp 65001
   neighbor 10.0.0.0 remote-as 65002
   neighbor 10.0.0.0 description leaf1
!
