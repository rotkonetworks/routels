---
name: routels
description: |
  Fast offline linter and Language Server for network configs:
  Arista EOS, FRR, VyOS, MikroTik RouterOS, BIRD, nftables/iptables,
  HAproxy, WireGuard, sysctl, and Debian /etc/network/interfaces.
homepage: https://github.com/rotkonetworks/routels
licenses:
  - MIT
  - Apache-2.0
languages:
  - Network
categories:
  - Linter
  - LSP

source:
  id: pkg:github/rotkonetworks/routels@v0.1.0
  asset:
    - target: linux_x64
      file: routels-{{version}}-x86_64-unknown-linux-musl.tar.gz
      bin: routels
    - target: linux_arm64
      file: routels-{{version}}-aarch64-unknown-linux-musl.tar.gz
      bin: routels
    - target: darwin_arm64
      file: routels-{{version}}-aarch64-apple-darwin.tar.gz
      bin: routels

bin:
  routels: "{{source.asset.bin}}"
