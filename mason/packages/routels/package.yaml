name: routels
description: Fast offline linter for Arista EOS, FRR, VyOS, MikroTik RouterOS, BIRD, and nftables/iptables-save configs.
homepage: https://github.com/rotkonetworks/routels
licenses:
  - MIT OR Apache-2.0
languages:
  - Network
categories:
  - Linter
source:
  id: pkg:github/rotkonetworks/routels@${version}
  asset:
    - target: linux_x64
      file: "routels-v${version}-x86_64-unknown-linux-musl.tar.gz"
      bin: "routels"
    - target: linux_arm64
      file: "routels-v${version}-aarch64-unknown-linux-musl.tar.gz"
      bin: "routels"
    - target: darwin_x64
      file: "routels-v${version}-x86_64-apple-darwin.tar.gz"
      bin: "routels"
    - target: darwin_arm64
      file: "routels-v${version}-aarch64-apple-darwin.tar.gz"
      bin: "routels"
bin:
  routels: "{{source.asset.bin}}"
